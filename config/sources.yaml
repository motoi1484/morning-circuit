# RSS feeds to crawl. Add/remove freely.
# `category` is passed to Claude as a hint for grouping segments.
feeds:
  # --- Tech / IT ---
  - name: The Verge
    url: https://www.theverge.com/rss/index.xml
    category: tech
  - name: Engadget
    url: https://www.engadget.com/rss.xml
    category: tech
  - name: TechCrunch
    url: https://techcrunch.com/feed/
    category: tech
  - name: Ars Technica
    url: https://feeds.arstechnica.com/arstechnica/index
    category: tech

  # --- Robotics ---
  - name: IEEE Spectrum Robotics
    url: https://spectrum.ieee.org/feeds/topic/robotics.rss
    category: robotics

  # --- Entertainment tech ---
  - name: The Verge - Entertainment
    url: https://www.theverge.com/entertainment/rss/index.xml
    category: entertainment
  - name: Variety - Digital
    url: https://variety.com/v/digital/feed/
    category: entertainment

# Max number of articles to feed into the script generator (keeps the prompt
# bounded). Most-recent-first after date filtering.
max_articles: 40
